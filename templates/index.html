<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix IA - Mines</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<canvas id="matrix"></canvas>

<div class="sidebar">
  <div class="logo">MATRIX IA</div>
  <a class="active">Dashboard</a>
  <a>Mines</a>
  <a>Crash</a>
  <a>Roleta</a>
  <a>Configurações</a>
</div>

<main class="main">

  <div class="topbar">
    <div class="online-dot"></div>
    <span id="onlineCount">1284</span> online
  </div>

  <div class="stats">
    <div class="card">
      <span>Usuários</span>
      <h3 id="usersCount">12845</h3>
    </div>
    <div class="card">
      <span>Sinais</span>
      <h3 id="signalsCount">3421</h3>
    </div>
    <div class="card">
      <span>Acertos</span>
      <h3 id="hitsCount">87%</h3>
    </div>
  </div>

  <section class="mines-box">

    <div class="mines-header">
      <h2>MINES PRO</h2>
      <div class="badge">ATIVO</div>
    </div>

    <div class="mines-info">
      <div>Bora1Bet</div>
      <div>Risco Baixo</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="signal-time">
      <span>Tempo Válido do Sinal</span>
      <strong id="timer">02:00</strong>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateSignal()">
      GERAR SINAL
    </button>

  </section>

</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
