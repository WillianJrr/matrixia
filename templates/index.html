<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<canvas id="matrix"></canvas>

<div class="sidebar">
    <div class="logo">MATRIX IA</div>
    <ul>
        <li class="active">Dashboard</li>
        <li>Mines</li>
        <li>Crash</li>
        <li>Roleta</li>
        <li>Configurações</li>
    </ul>
</div>

<div class="main">
    <div class="topbar">
        <h1>Painel Matrix IA</h1>
        <div class="online">● 1.284 online</div>
    </div>

    <div class="stats">
        <div class="card">
            <span>Usuários</span>
            <h2>12.845</h2>
        </div>
        <div class="card">
            <span>Sinais</span>
            <h2>3.421</h2>
        </div>
        <div class="card">
            <span>Acertos</span>
            <h2>87%</h2>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h2>MINES PRO</h2>
            <div class="badge">ATIVO</div>
        </div>

        <div class="controls">
            <select>
                <option>Bora1Bet</option>
                <option>Blaze</option>
                <option>JonBet</option>
            </select>

            <select>
                <option>Risco Baixo</option>
                <option>Risco Médio</option>
                <option>Risco Alto</option>
            </select>
        </div>

        <div class="grid" id="grid"></div>

        <div class="info">
            <div>Minas: <strong>3</strong></div>
            <div>Tentativas: <strong>1</strong></div>
            <div>Tempo: <strong id="timer">00:00</strong></div>
        </div>

        <button id="generate">GERAR SINAL</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
